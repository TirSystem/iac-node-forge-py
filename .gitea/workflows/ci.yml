# Purpose:  check every change of the Python client: format, lint, types,
#           layer contracts and the unit and contract tests (MIL-002 task 12).
# Triggers: a push to main or to the branch ci-workflow, and a pull request
#           to main; and by hand. Integration tests (a real Proxmox VE) never run
#           here: they are deselected by default and need PVE_TOKEN.
# Inputs:   none. Python version is set once in the env block below.
# Secrets:  none. The default token is read-only (contents: read).
# Changes:  nothing outside the run.
# Decision: ADR-0001 (provider test strategy): the runner image ships Python
#           3.12, so this job installs 3.13.
# Host:     Gitea Actions (Gitea 1.27.3, act_runner v3.5.0, label ubuntu-latest,
#           recorded on 2026-10-15); uses only github.* contexts.
name: CI

on:
  push:
    branches:
      - main
      - ci-workflow
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: Format, lint, types, layers and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the project and the tools
        run: python -m pip install -e ".[dev]"
      - name: Check the format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Check the types
        run: mypy src tests
      - name: Check the layer contracts
        run: lint-imports
      - name: Run the unit and contract tests
        run: pytest -q
