[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iac-node-forge"
version = "0.1.0"
description = "Command-line client of iac-node-forge, which manages servers at Proxmox VE and Contabo."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iac_node_forge"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.importlinter]
root_package = "iac_node_forge"

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
containers = ["iac_node_forge"]
layers = [
    "(presentation)",
    "(infrastructure)",
    "application",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Domain imports no outer layer"
type = "forbidden"
source_modules = ["iac_node_forge.domain"]
forbidden_modules = [
    "iac_node_forge.application",
    "iac_node_forge.infrastructure",
    "iac_node_forge.presentation",
]
