[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iac-node-forge"
version = "0.1.0"
description = "Command-line client of iac-node-forge, which manages servers at Proxmox VE and Contabo."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "keyring>=25.0",
]

[project.scripts]
iac-node-forge = "iac_node_forge.presentation.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iac_node_forge"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests against a real provider; need PVE_TOKEN (Proxmox VE) or the four CONTABO_ variables (Contabo); the power tests in test_power_live.py change the power state of a real server and need their own opt-in variables; test_provision_live.py creates a container in Proxmox VE and removes it through the product and needs its own opt-in variables; the real-sshd variant of test_transfer_contract.py starts a throw-away SSH server in Docker and needs IACNF_SSHD_TEST=1",
]

[tool.importlinter]
root_package = "iac_node_forge"

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
containers = ["iac_node_forge"]
layers = [
    "(presentation)",
    "(infrastructure)",
    "application",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Domain imports no outer layer"
type = "forbidden"
source_modules = ["iac_node_forge.domain"]
forbidden_modules = [
    "iac_node_forge.application",
    "iac_node_forge.infrastructure",
    "iac_node_forge.presentation",
]

[[tool.importlinter.contracts]]
name = "Presentation names infrastructure only in the composition root"
type = "forbidden"
source_modules = ["iac_node_forge.presentation"]
forbidden_modules = ["iac_node_forge.infrastructure"]
ignore_imports = [
    "iac_node_forge.presentation.cli.composition -> iac_node_forge.infrastructure.*",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Application imports no outer layer"
type = "forbidden"
source_modules = ["iac_node_forge.application"]
forbidden_modules = [
    "iac_node_forge.infrastructure",
    "iac_node_forge.presentation",
]
