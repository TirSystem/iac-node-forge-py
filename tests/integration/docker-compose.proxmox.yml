# Proxmox VE for the integration tests in tests/integration.
#
# WARNING: the image dockurr/proxmox is a third-party community image and runs
# privileged. It is for local development only: never use it in CI or on a
# shared host. The product owner chose this image.
#
# The password comes from PVE_PASSWORD and has no default, so this file contains no
# secret. Keep it in the git-ignored file tests/integration/pve.env (copy
# pve.env.example) and pass that file to compose:
#
#   docker compose --env-file tests/integration/pve.env #     -f tests/integration/docker-compose.proxmox.yml up -d
#
# A PVE_PASSWORD already set in the shell is used when no --env-file is given.
services:
  proxmox-node1:
    image: dockurr/proxmox:latest
    container_name: proxmox-node1
    privileged: true
    ports:
      - "8006:8006"
    environment:
      - PVE_PASSWORD=${PVE_PASSWORD:?set PVE_PASSWORD in your environment}
    volumes:
      - /lib/modules:/lib/modules:ro
    restart: unless-stopped
